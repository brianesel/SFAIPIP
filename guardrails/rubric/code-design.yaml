# Code design rubric. Baseline: Clean Apex Code (P. Gonzalez, Apress 2025) chapter topics,
# plus general clean-code practices. Anchors are our own wording, not quotes.
# Thresholds are [low] defaults: tune in calibration. PMD rule names [med]: verify with
#   sf code-analyzer rules --rule-selector pmd
# Legacy orgs: score honestly here; phase 2 enforces "changed file must not get worse".
# Simple first (best-practices/clean-apex.md). by_structure_level: per ARCH-007 level (lean | standard | enterprise),
#   tools/score.py replaces weight / zero_at / full_at / measure / anchors before project overrides apply.
#   No level or keep-existing → the check's own values (= standard).
aspect: code_design
name: Code design (clean Apex)
checks:
  # --- Formatting (gate: cheap, automatic) ---
  - id: design.formatting
    guardrail: HG-10
    type: gate
    pillar: opex
    measure: "prettier --check with prettier-plugin-apex passes on force-app (Apex + LWC)"
    evidence: prettier output

  - id: design.lwc_eslint
    guardrail: HG-10
    type: gate
    pillar: opex
    measure: "0 severity 1-2 findings from Code Analyzer eslint engine on lwc/"
    evidence: code-analyzer.json

  # --- Naming (CAC ch.2) ---
  - id: design.naming_conventions
    type: measured
    pillar: opex
    weight: 10
    zero_at: 70
    full_at: 100
    measure: >
      % of classes/triggers matching project naming rules (regex), e.g. PascalCase;
      suffix by role: *Service, *Selector, *Domain, *TriggerHandler, *Test, *Batch, *Queueable;
      trigger = <Object>Trigger
    evidence: metadata inventory + naming regex
  - id: design.naming_intent
    type: judged
    pillar: opex
    weight: 5
    anchors:
      0: "Names are abbreviations or generic (data, temp, util, helper, doStuff); same concept has several names."
      50: "Most names readable; some generic utility classes or inconsistent terms."
      100: "Names state intent in business terms, one word per concept, no generic dumping-ground classes."

  # --- Doing one thing (CAC ch.3) ---
  - id: design.flag_params
    type: measured
    pillar: opex
    weight: 5
    zero_at: 80
    full_at: 100
    measure: "% of public/global methods without a Boolean parameter that switches behavior"
    evidence: regex scan + review of hits
  - id: design.param_count
    type: measured
    pillar: opex
    weight: 5
    zero_at: 85
    full_at: 100
    measure: "% of methods with ≤ 4 parameters (PMD ExcessiveParameterList)"
    evidence: code-analyzer.json

  # --- Method length and depth (CAC ch.4) ---
  - id: design.method_size
    type: measured
    pillar: opex
    weight: 10
    zero_at: 70
    full_at: 100
    measure: "% of non-test methods ≤ 30 statements (PMD NcssMethodCount)"
    evidence: code-analyzer.json
  - id: design.method_complexity
    type: measured
    pillar: opex
    weight: 10
    zero_at: 80
    full_at: 100
    measure: "% of methods below CognitiveComplexity threshold 15 (PMD CognitiveComplexity)"
    evidence: code-analyzer.json
  - id: design.nesting_depth
    type: measured
    pillar: opex
    weight: 5
    zero_at: 20
    full_at: 0
    measure: "Count of deeply nested if blocks > 3 levels (PMD AvoidDeeplyNestedIfStmts)"
    evidence: code-analyzer.json

  # --- Comments (CAC ch.5) ---
  - id: design.commented_out_code
    type: measured
    pillar: opex
    weight: 3
    zero_at: 50
    full_at: 0
    measure: "Count of commented-out code blocks (regex: comment lines ending in ; or { or })"
    evidence: regex scan
  - id: design.comments_why
    type: judged
    pillar: opex
    weight: 4
    anchors:
      0: "Comments restate code, are outdated or misleading; required why-comments (SYSTEM_MODE, without sharing, suppressions) missing; public APIs undocumented."
      50: "Required why-comments and public API docs present; some comments still restate code."
      100: "No comments that restate code; why-comments only where clean-apex.md § Comments requires or allows them; public APIs documented."

  # --- Null, validations, guard clauses (CAC ch.6) ---
  - id: design.guard_clauses
    type: judged
    pillar: reliability
    weight: 8
    anchors:
      0: "Inputs unchecked; null handling by accident; deep if-else pyramids; NullPointerException in logs."
      50: "Null checks present but scattered; mix of guard clauses and nested checks."
      100: "Inputs validated at entry with guard clauses and early return/throw; nulls handled deliberately; no NPEs in recent logs."

  # --- Cascading failures in trigger boundaries (CAC ch.7) ---
  - id: design.trigger_boundary
    type: judged
    pillar: reliability
    weight: 8
    anchors:
      0: "One bad record fails the whole batch with an unhandled exception; errors don't reach the user/record."
      50: "Some handling; all-or-nothing vs partial success not decided per entry point."
      100: "Each entry point decides all-or-nothing vs partial success; per-record addError for user errors; async/integration failures isolated and logged."

  # --- OOP, design principles, classes (CAC ch.8-9) ---
  - id: design.class_size
    type: measured
    pillar: opex
    weight: 5
    zero_at: 80
    full_at: 100
    measure: "% of classes ≤ 300 statements (PMD NcssTypeCount)"
    evidence: code-analyzer.json
  - id: design.class_responsibility
    type: judged
    pillar: opex
    weight: 7
    anchors:
      0: "God classes mixing query, logic, DML, callout and UI; copy-paste instead of reuse; static everything."
      50: "Most classes have one role; some mixed responsibilities; abstraction used unevenly."
      100: "One responsibility per class (SOLID single responsibility); extension points (interface, strategy) only where a second real variant exists; no unused abstraction (YAGNI)."

  - id: design.speculative_generality
    type: judged
    pillar: opex
    weight: 5
    anchors:
      0: "Layers, interfaces, factories, wrappers or settings beyond the structure level with no second use or test seam; parameters and options nobody uses."
      50: "Mostly at the structure level; a few speculative abstractions or forwarding wrappers."
      100: "Least code for the AC at the structure level; every interface, layer and setting has a second real use or a test seam."

  # --- Modularity, coupling, cohesion (CAC ch.10) ---
  - id: design.layering
    type: measured
    pillar: opex
    weight: 8
    zero_at: 50
    full_at: 100
    measure: "% of SOQL statements located in selector classes (and DML in service/unit-of-work), excluding tests"
    evidence: regex scan by class role
    by_structure_level:
      lean: {weight: 4, measure: "% of SOQL statements used by 2+ classes that live in a selector; DML in services, not triggers or controllers"}
      enterprise: {zero_at: 70}
  - id: design.coupling
    type: measured
    pillar: opex
    weight: 5
    zero_at: 70
    full_at: 100
    measure: "% of classes depending on ≤ 7 other custom classes (MetadataComponentDependency via Tooling API)"
    evidence: dependency query export
  - id: design.duplication
    type: measured
    pillar: opex
    weight: 5
    zero_at: 10
    full_at: 0
    measure: "% duplicated Apex lines (Code Analyzer cpd engine)"
    evidence: code-analyzer.json (cpd)

  # --- Dependency injection and boundaries (CAC ch.11) ---
  - id: design.di_seams
    type: judged
    pillar: reliability
    weight: 6
    anchors:
      0: "Callouts, queries and time/user lookups are hardwired; logic cannot be tested without real DML/callouts."
      50: "Some seams (interfaces, @TestVisible injection) at external boundaries only."
      100: "External systems and data access behind interfaces; dependencies injected (constructor/factory/Stub API); core logic testable in memory."
    by_structure_level:
      lean:
        anchors:
          0: "Callouts hardwired; logic that needs a callout or time cannot be tested."
          50: "Callouts mocked; some interfaces with a single non-test implementation."
          100: "Seams only at callouts and true test needs (HttpCalloutMock, Stub API, @TestVisible); no interface with a single non-test implementation."
      standard:
        anchors:
          0: "Callouts, queries and time/user lookups are hardwired; logic cannot be tested without real DML/callouts."
          50: "Callouts mocked; time and user context hardwired."
          100: "Seams at callouts, time, user context and selectors on busy objects; no interface with a single non-test implementation."

  # --- General clean-code extras ---
  - id: design.magic_literals
    type: measured
    pillar: opex
    weight: 5
    zero_at: 50
    full_at: 0
    measure: "Count of business literals (numbers ≠ 0/1, status/picklist strings, URLs, emails) in logic; config belongs in Custom Metadata / Labels / constants"
    evidence: regex scan + triage
  - id: design.dead_code
    type: measured
    pillar: cost
    weight: 5
    zero_at: 15
    full_at: 0
    measure: "% of classes/methods with no references (dependency query + PMD unused rules), excluding entry points"
    evidence: dependency query + code-analyzer.json
  - id: design.api_version
    type: measured
    pillar: reliability
    weight: 4
    zero_at: 50
    full_at: 100
    measure: "% of Apex classes, triggers and Flows on API version within the last 3 years (~9 releases); regex:AvoidOldSalesforceApiVersions"
    evidence: metadata inventory
  - id: design.single_logger
    type: measured
    pillar: opex
    weight: 4
    zero_at: 20
    full_at: 0
    measure: "Count of System.debug calls in non-test code (one logging framework expected)"
    evidence: regex scan
