# Test case schema. Per ticket folder: docs/tests/<KEY>/
#   tester.yaml   written by the tester from the ticket AC — WITHOUT seeing ai.yaml
#   ai.yaml       generated by AI from ticket AC + metadata + pattern + risks — WITHOUT seeing tester.yaml
#   alignment.md  generated by `dev_cycle.py align` (both / tester-only / ai-only / gaps)
#   agreed.yaml   the merged set, every case accepted or rejected with reason (tester + dev decide)
#   results/iter-N.yaml   one file per test run of the implement → test → feedback loop
version: 1
categories: [happy, negative, bulk, permission, boundary, null_input, regression, integration, ui]   # "null_input" not "null": YAML reads bare null as empty
levels: [unit, integration, uat]
automation_types: [apex, jest, manual]

# Category required per ticket context (checked on agreed.yaml). Waive only with a reason.
required_categories:
  always: [happy, negative]
  when_metadata_type: {trigger: [bulk], flow: [bulk]}
  when_access_not_none: [permission]
  when_migration_items: [regression]

case_fields:            # one entry in cases:
  id: "T-nn (tester) · A-nn (ai) · C-nn (agreed)"
  ac: "list of AC ids: AC-1 = first acceptance_criteria item in the ticket, AC-2 second …"
  category: "one of categories"
  title: "short, behavior-focused"
  given: ""
  when: ""
  then: ""
  level: "unit | integration | uat"
  automation: "{type: apex|jest|manual, test: Class.method | jest test name | -}"

agreed_extra_fields:
  origin: "[T-nn, A-nn] — which source cases it came from"
  status: "proposed | accepted | rejected — align writes proposed; only a human sets accepted/rejected; align --check fails while any case is proposed"
  reason: "required when rejected; also when one source's case was changed in merging"

results_file:           # results/iter-N.yaml
  iteration: 1
  date: "YYYY-MM-DD"
  build: "commit sha / PR"
  results: "{C-nn: {status: pass|fail|blocked, evidence: '', note: ''}}"
  coverage: "{ClassName: percent} — filled by `dev_cycle.py import-apex`"
